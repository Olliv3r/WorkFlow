{% extends 'base.html' %}{% block content %}<div class="page-wrap"><div class="page-header"><div><div class="page-title">Editar diária #{{ item.id }}</div></div></div><div class="panel"><form method="post" class="row g-3"><div class="col-md-3"><label class="field-label">Data</label><input type="date" name="date" value="{{ item.date.isoformat() }}" class="form-control" required></div><div class="col-md-3"><label class="field-label">Período</label><select name="period" class="form-select">{% for p in ['Inteira','Meia','Outro parcial'] %}<option {{ 'selected' if item.period==p else '' }}>{{ p }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="field-label">Valor</label><input name="amount" value="{{ '%.2f'|format(item.total_amount)|replace('.', ',') }}" class="form-control" required></div><div class="col-md-3"><label class="field-label">Serviços</label><input name="description" value="{{ item.description }}" class="form-control"></div><div class="col-12"><label class="field-label">Observação</label><input name="observation" value="{{ item.observation or '' }}" class="form-control"></div><div class="col-12"><button class="btn btn-primary">Salvar</button> <a href="{{ url_for('daily_work.details', item_id=item.id) }}" class="btn btn-outline-secondary">Cancelar</a></div></form></div></div>{% endblock %}
